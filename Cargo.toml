[workspace]
members = ["crates/core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[package]
name = "skillbase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Manage Agent Skills across every coding agent on your machine."
publish = false

[dependencies]
skillbase-core = { path = "crates/core" }
gpui-kit = { version = "0.6", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-toml",
] }
anyhow = "1"
rust-embed = "8"

# Reading the system accent colour for the focus ring. Both crates are already
# in the lock file by way of `gpui`; this only widens the feature set.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSColor",
    "NSColorSpace",
    "NSResponder",
    "objc2-core-foundation",
] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
