[workspace]
members = ["crates/core"]

[workspace.package]
edition = "2024"
version = "0.1.4"
license = "MIT"

[package]
name = "skillbase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Manage Agent Skills across every coding agent on your machine."
publish = false

[dependencies]
skillbase-core = { path = "crates/core" }
gpui-kit = { version = "0.6", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-toml",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
] }
anyhow = "1"
rust-embed = "8"

# Reading the system accent colour, and noticing when the user changes it. All
# of these crates are already in the lock file by way of `gpui`; this only
# widens the feature set.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSColor",
    "NSColorSpace",
    "NSResponder",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSString",
] }

# The dialog tests open a real window and draw it, which is the only way to
# reach the code that builds a dialog.
[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
