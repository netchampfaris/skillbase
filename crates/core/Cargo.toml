[package]
name = "skillbase-core"
version.workspace = true
edition.workspace = true
description = "Model, read and write open-format Agent Skills (SKILL.md) with round-trip fidelity."
license.workspace = true

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
